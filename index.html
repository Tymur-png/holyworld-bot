<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CosmoPunk: Синдикатные войны - История</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #05000a;
            --accent: #d300d3;
            --cyan: #00f7ff;
            --yellow: #f7ff00;
            --red: #ff2a2a;
            --glass: rgba(16, 20, 30, 0.95);
            --border: rgba(0, 247, 255, 0.3);
            --font: 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg);
            color: #fff;
            font-family: var(--font);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        #matrix-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; opacity: 0.15; pointer-events: none;
        }

        #app { 
            display: flex; flex-direction: column; height: 100vh; padding: 12px; 
            position: relative; z-index: 10; pointer-events: none; 
        }
        
        .interactive { pointer-events: auto; }

        .hud { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .res-box {
            background: var(--glass); border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,247,255,0.1);
            min-width: 100px;
        }
        #energy-val { font-size: 20px; font-weight: 900; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
        .sub-text { font-size: 10px; color: #aaa; margin-top: 2px; }
        .rank-box { text-align: right; border-color: var(--accent); }
        #rank-val { color: var(--accent); font-weight: bold; font-size: 12px; text-transform: uppercase; }

        .lang-btn {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
            background: #111; border: 1px solid #444; color: #fff;
            padding: 4px 10px; border-radius: 12px; font-size: 10px;
            z-index: 100; cursor: pointer; pointer-events: auto;
            opacity: 0.8;
        }

        .combo-container {
            width: 100%; height: 6px; background: #222; margin-bottom: 15px;
            border-radius: 3px; overflow: hidden; position: relative;
            box-shadow: 0 0 5px rgba(0,0,0,0.5); pointer-events: auto;
        }
        .combo-fill {
            height: 100%; background: linear-gradient(90deg, var(--yellow), var(--red));
            width: 0%; transition: width 0.1s linear;
        }
        .combo-text {
            position: absolute; width: 100%; text-align: center; top: -15px;
            font-size: 10px; font-weight: bold; color: var(--yellow); opacity: 0;
            transition: opacity 0.2s;
        }

        #stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; pointer-events: none; }
        
        .reactor-wrap { 
            position: relative; width: 280px; height: 280px; 
            display: flex; justify-content: center; align-items: center; 
            transition: transform 0.1s; z-index: 20; cursor: pointer;
        }
        .reactor-wrap:active { transform: scale(0.95); }
        .shake { animation: shake 0.15s cubic-bezier(.36,.07,.19,.97) both; }
        #reactor-img { 
            width: 100%; height: 100%; object-fit: contain; z-index: 5;
            filter: drop-shadow(0 0 30px rgba(211,0,211,0.5)); pointer-events: none;
        }

        #raid-btn {
            position: absolute; top: 10%; right: 10px;
            width: 60px; height: 60px; background: var(--red);
            border-radius: 50%; border: 3px solid #fff;
            display: none; align-items: center; justify-content: center;
            font-size: 24px; animation: pulse-btn 0.5s infinite;
            z-index: 50; cursor: pointer; box-shadow: 0 0 20px var(--red);
        }

        #hack-btn {
            margin-top: 25px;
            background: linear-gradient(90deg, #ff004c, #ff9100);
            border: none; padding: 12px 24px; border-radius: 25px;
            color: #fff; font-weight: bold; font-size: 14px; letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 0, 76, 0.4);
            opacity: 0.5; filter: grayscale(1); pointer-events: none; transition: 0.3s;
            position: relative; z-index: 25;
        }
        #hack-btn.ready { opacity: 1; filter: grayscale(0); pointer-events: auto; animation: pulse-btn 1.5s infinite; }

        .nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding-bottom: 10px; position: relative; z-index: 30; pointer-events: auto; max-height: 220px; overflow-y: auto; }
        .nav-btn {
            background: rgba(0,0,0,0.8); border: 1px solid var(--border); border-radius: 12px;
            height: 55px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 10px; color: #888; transition: 0.2s; backdrop-filter: blur(4px);
        }
        .nav-btn span { font-size: 20px; margin-bottom: 4px; }
        .nav-btn:active { background: var(--cyan); color: #000; border-color: #fff; transform: translateY(2px); }

        .modal-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
            display: none; align-items: flex-end; justify-content: center;
            pointer-events: auto; animation: fadeIn 0.2s;
        }
        .modal-card {
            background: #0b0514; border-top: 2px solid var(--accent);
            width: 100%; max-height: 85vh; border-radius: 20px 20px 0 0;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 -10px 50px rgba(211, 0, 211, 0.2);
            animation: slideUp 0.3s;
        }
        .modal-header { 
            padding: 15px; text-align: center; font-weight: bold; font-size: 16px; 
            border-bottom: 1px solid #222; letter-spacing: 2px; color: var(--accent);
        }
        .modal-body { padding: 15px; overflow-y: auto; flex: 1; }

        .item { 
            display: flex; gap: 12px; align-items: center; 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
            padding: 10px; border-radius: 12px; margin-bottom: 10px;
        }
        .item img { 
            width: 50px; height: 50px; object-fit: contain; 
            background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px solid #333;
        }
        .item-info { flex: 1; }
        .item-name { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 4px;}
        .item-desc { font-size: 11px; color: #888; }
        .btn-buy {
            background: var(--cyan); color: #000; border: none; padding: 8px 14px;
            border-radius: 8px; font-size: 12px; font-weight: bold; min-width: 80px;
        }
        .btn-owned { background: #333; color: #555; pointer-events: none; }

        .hack-track {
            width: 100%; height: 24px; background: #111; border-radius: 12px;
            position: relative; overflow: hidden; margin: 25px 0; border: 2px solid #444;
        }
        .hack-target {
            position: absolute; top: 0; bottom: 0; width: 40px; 
            background: var(--yellow); opacity: 0.8; left: 50%; transform: translateX(-50%);
            box-shadow: 0 0 15px var(--yellow);
        }
        .hack-cursor {
            position: absolute; top: -2px; bottom: -2px; width: 4px;
            background: var(--red); left: 0%; 
            box-shadow: 0 0 10px var(--red); z-index: 2;
        }
        .hack-btn-action {
            width: 100%; padding: 18px; background: var(--red); color: #fff;
            border: none; font-size: 18px; font-weight: 900; border-radius: 12px;
        }

        .float-txt { 
            position: absolute; font-weight: 900; font-size: 26px; 
            pointer-events: none; z-index: 90; text-shadow: 0 2px 0 #000;
        }

        .daily-reward-btn {
            position: fixed; top: 50px; right: 12px;
            background: linear-gradient(135deg, var(--yellow), var(--accent));
            border: 2px solid #fff; border-radius: 50%;
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; z-index: 100;
            cursor: pointer; box-shadow: 0 0 20px rgba(247, 255, 0, 0.5);
            animation: pulse-daily 2s infinite;
        }
        .daily-reward-btn.claimed { opacity: 0.5; animation: none; }

        .event-notification {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--glass); border: 2px solid var(--yellow);
            padding: 20px; border-radius: 15px; z-index: 200;
            text-align: center; max-width: 300px; display: none;
            box-shadow: 0 0 30px rgba(247, 255, 0, 0.5);
        }

        .achievement-badge {
            display: inline-block; background: linear-gradient(135deg, var(--yellow), var(--accent));
            padding: 4px 8px; border-radius: 12px; font-size: 10px; font-weight: bold;
            margin-left: 8px; color: #000;
        }
        
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-3px, 0, 0); } 40%, 60% { transform: translate3d(3px, 0, 0); } }
        @keyframes pulse-btn { 0% {box-shadow: 0 0 0 0 rgba(255, 0, 76, 0.7); transform:scale(1);} 50% {transform:scale(1.05);} 100% {box-shadow: 0 0 0 15px rgba(255, 0, 76, 0); transform:scale(1);} }
        @keyframes pulse-daily { 0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(247, 255, 0, 0.5); } 50% { transform: scale(1.1); box-shadow: 0 0 30px rgba(247, 255, 0, 0.8); } }
        @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div id="app">
    <button class="lang-btn" id="lang-toggle" onclick="toggleLang()">RU</button>

    <div class="hud interactive">
        <div class="res-box">
            <div id="energy-val">0</div>
            <div class="sub-text" id="inc-val">+0 / sec</div>
        </div>
        <div class="res-box rank-box">
            <div id="rank-val" data-key="rank_0">Изгой</div>
            <div class="sub-text" data-key="ui_rank">РАНГ</div>
        </div>
    </div>

    <div class="daily-reward-btn interactive" id="daily-btn" onclick="claimDailyReward()" title="Ежедневная награда">📅</div>
    
    <div class="event-notification interactive" id="event-notification">
        <div style="font-size: 18px; font-weight: bold; margin-bottom: 10px; color: var(--yellow);">⚡ СОБЫТИЕ!</div>
        <div id="event-text" style="font-size: 14px; margin-bottom: 15px;"></div>
        <button class="hack-btn-action" onclick="document.getElementById('event-notification').style.display = 'none'" style="padding: 10px;">OK</button>
    </div>

    <div class="combo-container">
        <div class="combo-text" id="combo-txt">COMBO x1.0</div>
        <div class="combo-fill" id="combo-bar"></div>
    </div>

    <div id="stage">
        <div id="enemy-card" style="margin-bottom: 15px; padding: 15px; background: rgba(255,0,0,0.1); border: 2px solid #ff2a2a; border-radius: 12px; display: none;">
            <div id="enemy-name" style="color: var(--red); font-weight: bold; margin-bottom: 5px;"></div>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <div style="flex: 1; background: #111; border-radius: 4px; overflow: hidden;">
                    <div id="enemy-hp-bar" style="height: 20px; background: linear-gradient(90deg, #ff2a2a, #ff9900); width: 100%;"></div>
                </div>
                <div id="enemy-hp-text" style="color: var(--cyan); font-size: 12px;"></div>
            </div>
            <div style="display: flex; gap: 8px;">
                <button class="hack-btn-action" onclick="attackEnemy()" style="flex: 1; padding: 8px; font-size: 14px;">⚔️ АТАКА</button>
                <button class="hack-btn-action" onclick="runFromEnemy()" style="flex: 1; padding: 8px; font-size: 14px; background: #666;">🏃 БЕГСТВО</button>
            </div>
        </div>

        <div id="raid-btn" class="interactive" onclick="hitRaidBoss()">👾</div>
        <div class="reactor-wrap interactive" id="tap-zone">
            <img src="assets/reactor/reactor.gif" id="reactor-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/9309/9309584.png'">
        </div>
        <button id="hack-btn" class="interactive" onclick="startHackGame()" data-key="btn_hack">☠ ВЗЛОМ СИСТЕМЫ</button>
        <button id="explore-btn" class="interactive" style="margin-top: 10px; padding: 12px 24px; background: var(--yellow); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; display: none;" onclick="startExplore()">🗺️ ИССЛЕДОВАТЬ</button>
    </div>

    <div class="nav interactive">
        <div class="nav-btn" onclick="openMenu('ships')"><span>🚀</span><div data-key="menu_fleet">Флот</div></div>
        <div class="nav-btn" onclick="openMenu('crew')"><span>👥</span><div data-key="menu_crew">Команда</div></div>
        <div class="nav-btn" onclick="openMenu('implants')"><span>🧠</span><div data-key="menu_imp">Импланты</div></div>
        <div class="nav-btn" onclick="openMenu('quests')"><span>📜</span><div>Квесты</div></div>
        <div class="nav-btn" onclick="openMenu('achievements')"><span>🏆</span><div>Достижения</div></div>
        <div class="nav-btn" onclick="openMenu('daily')"><span>📅</span><div>Ежедневно</div></div>
        <div class="nav-btn" onclick="openMenu('upgrades')"><span>⚡</span><div>Улучшения</div></div>
        <div class="nav-btn" onclick="openMenu('events')"><span>⚡</span><div>События</div></div>
        <div class="nav-btn" onclick="openMenu('prestige')"><span>🔄</span><div>Перерождение</div></div>
        <div class="nav-btn" onclick="openMenu('story')"><span>📖</span><div>Сюжет</div></div>
        <div class="nav-btn" onclick="openMenu('factions')"><span>⚔️</span><div>Фракции</div></div>
        <div class="nav-btn" onclick="openMenu('journal')"><span>📓</span><div>Журнал</div></div>
    </div>
</div>

<div class="modal-overlay" id="main-modal" onclick="if(event.target.id==='main-modal') closeModal()">
    <div class="modal-card interactive">
        <div class="modal-header" id="modal-title">TITLE</div>
        <div class="modal-body" id="modal-content"></div>
        <button style="padding:15px; background:#111; color:#fff; border:none; border-top:1px solid #333; font-weight:bold;" onclick="closeModal()" data-key="btn_close">ЗАКРЫТЬ</button>
    </div>
</div>

<div class="modal-overlay" id="hack-modal">
    <div class="modal-card interactive" style="height: auto; border-color: var(--red);">
        <div class="modal-header" style="color:var(--red)" data-key="hack_title">ВЗЛОМ ФАЙРВОЛА</div>
        <div class="modal-body">
            <div id="hack-game-ui">
                <p style="color:#ccc; font-size:12px; margin-bottom:10px;" data-key="hack_desc">Останови курсор в жёлтой зоне!</p>
                <div class="hack-track">
                    <div class="hack-target" id="hack-target-zone"></div>
                    <div class="hack-cursor" id="hack-cursor"></div>
                </div>
                <button class="hack-btn-action" onmousedown="stopHack()" ontouchstart="stopHack()" data-key="btn_breach">ВЗЛОМАТЬ</button>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="loot-modal">
    <div class="modal-card interactive" style="height: auto; border-color: var(--yellow);">
        <div class="modal-header" style="color: var(--yellow)">🎁 ПОЛУЧЕНА ДОБЫЧА</div>
        <div class="modal-body" id="loot-content" style="text-align: center; padding: 30px;">
            <div id="loot-items"></div>
            <button class="hack-btn-action" onclick="document.getElementById('loot-modal').style.display = 'none'" style="margin-top: 20px;">ПРИНЯТЬ</button>
        </div>
    </div>
</div>

    const AudioFX = {

        init: function() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
        play: function(type) {
            if(!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            const now = this.ctx.currentTime;
            if(type === 'tap') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'buy') {
                osc.type = 'square'; osc.frequency.setValueAtTime(400, now); osc.frequency.linearRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'raid') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.linearRampToValueAtTime(50, now + 0.3);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);

        }
    };

    function calcIncome() {
        let income = 0;
        DB.ships.forEach(s => { if(state.ships[s.id]) income += state.ships[s.id] * s.inc; });
        if(state.crew['c2']) income += state.crew['c2'] * 30;
        let mult = 1;
        state.implants.forEach(impId => {
            let item = DB.implants.find(i => i.id === impId);
            if(item && item.globalMult) mult += item.globalMult;
        });
        mult += (state.prestigeTokens * 0.1);
        if(state.upgrades['up3']) mult *= 1.25;
        if(state.activeEvents['ev1'] && state.activeEvents['ev1'] > Date.now()) mult *= 2;
        if(state.activeEvents['daily_boost'] && state.activeEvents['daily_boost'] > Date.now()) mult *= 1.1;
        return income * mult;
    }

    function tap(e) {
        if(state.inBattle) return;
        AudioFX.init();

        let touches = e ? (e.changedTouches || [e]) : [{clientX: window.innerWidth/2, clientY: window.innerHeight/2}];

        clearTimeout(comboTimer);

        for(let t of touches) {
            let critChance = 0.05 + (state.crew['c1'] || 0) * 0.05;
            if(state.upgrades['up4']) critChance += 0.1;
            let isCrit = false;
            if(state.activeEvents['ev2'] && state.activeEvents['ev2'] > Date.now()) {
                isCrit = true;
            } else {
                isCrit = Math.random() < critChance;
            }
            if(isCrit) { power *= critMult; tg.HapticFeedback.notificationOccurred('warning'); } 
            else { tg.HapticFeedback.impactOccurred('light'); }

            addEnergy(power);
            spawnFloat(t.clientX, t.clientY, Math.floor(power), isCrit);
            AudioFX.play('tap');
        }
        
        const r = document.getElementById('reactor-img');
        r.classList.remove('shake');
        void r.offsetWidth; r.classList.add('shake');
        checkAchievements();
        checkQuestProgress();
    }

    function spawnFloat(x, y, val, isCrit) {
        let el = document.createElement('div');
        el.className = 'float-txt';
        el.style.left = (x - 20) + 'px'; el.style.top = (y - 40) + 'px';
        el.innerText = `+${val}`;
        el.style.color = isCrit ? 'var(--red)' : 'var(--cyan)';
        if(isCrit) el.style.fontSize = '32px';
        document.body.appendChild(el);
        setTimeout(() => {
            el.style.transition = 'all 0.6s';
            el.style.transform = 'translateY(-100px) scale(1.2)';
            el.style.opacity = 0;
        }, 50);
        setTimeout(() => el.remove(), 600);
    }

    function updateHUD() {
        document.getElementById('energy-val').innerText = formatNum(Math.floor(state.energy));
        let income = calcIncome();
        document.getElementById('inc-val').innerText = `+${formatNum(Math.floor(income))} / s`;
        let ranks = [t('rank_0'), t('rank_1'), t('rank_2'), t('rank_3'), t('rank_4'), t('rank_5'), t('rank_6'), t('rank_7')];
        let rIdx = Math.min(Math.floor(Math.log10(state.total + 1)), ranks.length-1);
        if(state.total < 1000) rIdx = 0;
        let repBonus = 0;
        for(let key in state.factionRep) {
            if(state.factionRep[key] >= 50) repBonus += 0.1;
            if(state.factionRep[key] >= 200) repBonus += 0.2;
        }
        document.getElementById('rank-val').innerHTML = ranks[rIdx] + (repBonus > 0 ? ` +${Math.round(repBonus*100)}%` : '');
        updateDailyButton();
    }

    // ------------------------ БОЕВАЯ СИСТЕМА -------------------------
    function startExplore() {
        let loc = LOCATIONS[state.location];
        let enemies = loc.enemies;
        let randomEnemy = enemies[Math.floor(Math.random() * enemies.length)];
        startBattle(randomEnemy);
    }

    function startBattle(enemyType) {
        state.inBattle = true;
        state.currentEnemy = enemyType;
        let enemy = ENEMIES[enemyType];
        state.enemyHP = enemy.hp;
        document.getElementById('enemy-card').style.display = 'block';
        updateEnemyDisplay();
    }

    function updateEnemyDisplay() {
        let enemy = ENEMIES[state.currentEnemy];
        document.getElementById('enemy-name').innerText = enemy.name + ' - ' + enemy.rarity.toUpperCase();
        document.getElementById('enemy-hp-text').innerText = `${state.enemyHP}/${enemy.hp}`;
        let percent = (state.enemyHP / enemy.hp) * 100;
        document.getElementById('enemy-hp-bar').style.width = Math.max(0, percent) + '%';
    }

    function attackEnemy() {
        if(!state.inBattle) return;
        let enemy = ENEMIES[state.currentEnemy];
        let damage = Math.floor(1 + Math.random() * 15 + (state.crew['c3'] || 0) * 2);
        state.enemyHP -= damage;
        spawnFloat(window.innerWidth / 2, 150, damage, false);
        AudioFX.play('tap');
        if(state.enemyHP <= 0) {
            finishBattle();
        } else {
            updateEnemyDisplay();
        }
    }

    function runFromEnemy() {
        if(Math.random() > 0.5) {
            state.inBattle = false;
            state.currentEnemy = null;
            document.getElementById('enemy-card').style.display = 'none';
            tg.HapticFeedback.notificationOccurred('warning');
        } else {
            alert('Не удалось сбежать!');
        }
    }

    function finishBattle() {
        let enemy = ENEMIES[state.currentEnemy];
        let reward = enemy.reward * (1 + state.prestigeTokens * 0.1);
        addEnergy(reward);
        
        state.defeatedEnemies[state.currentEnemy] = (state.defeatedEnemies[state.currentEnemy] || 0) + 1;
        state.totalEnemiesDefeated++;
        checkQuestProgress();
        checkAchievements();
        
        let lootItems = [];
        let lootChance = state.upgrades['up6'] ? 1.5 : 1;
        enemy.loot.forEach(item => { if(Math.random() < 0.4 * lootChance) lootItems.push(item); });
        showLoot(lootItems, reward);
        
        // Репутация за убийство
        if(enemy.rarity === 'common') state.factionRep.syndicate = (state.factionRep.syndicate || 0) + 1;
        if(enemy.rarity === 'rare') state.factionRep.runners = (state.factionRep.runners || 0) + 2;
        if(enemy.rarity === 'epic') state.factionRep.omega = (state.factionRep.omega || 0) + 3;
        if(enemy.rarity === 'legendary') state.factionRep.syndicate = (state.factionRep.syndicate || 0) + 5;
        
        state.inBattle = false;
        state.currentEnemy = null;
        document.getElementById('enemy-card').style.display = 'none';
        tg.HapticFeedback.notificationOccurred('success');
    }

    function showLoot(items, reward) {
        document.getElementById('loot-modal').style.display = 'flex';
        let content = `<div style="font-size: 20px; color: var(--yellow); margin-bottom: 15px;">+${Math.floor(reward)} PUNK</div>`;
        items.forEach(item => { content += `<div style="color: #aaa; margin: 5px;">📦 ${item}</div>`; });
        if(items.length === 0) content += '<div style="color: #888;">Нет лута</div>';
        document.getElementById('loot-items').innerHTML = content;
    }

    // ------------------------ ВЗЛОМ -------------------------
    let hackAnim, hackDir = 1.2, hackPos = 0;

    function checkHackStatus() {
        let now = Date.now();
        let btn = document.getElementById('hack-btn');
        let cooldown = state.upgrades['up7'] ? 210000 : 300000;
        if(state.activeEvents['ev3'] && state.activeEvents['ev3'] > Date.now()) cooldown = 0;
        let diff = now - state.lastHack;
        if(diff > cooldown) {
            btn.classList.add('ready');
            btn.innerText = t('btn_hack_ready');
        } else {
            btn.classList.remove('ready');
            let left = Math.ceil((cooldown - diff)/1000);
            let min = Math.floor(left/60);
            let sec = left%60;
            btn.innerText = `${t('btn_hack_wait')} ${min}:${sec < 10 ? '0'+sec : sec}`;
        }
    }

    function startHackGame() {
        let cooldown = state.upgrades['up7'] ? 210000 : 300000;
        if(!(state.activeEvents['ev3'] && state.activeEvents['ev3'] > Date.now()) && Date.now() - state.lastHack < cooldown) return;
        document.getElementById('hack-modal').style.display = 'flex';
        hackPos = 0; hackDir = 1.2;
        let targetLeft = 20 + Math.random() * 50;
        document.getElementById('hack-target-zone').style.left = targetLeft + '%';
        window.hackTargetMin = targetLeft;
        window.hackTargetMax = targetLeft + 15;
        function animate() {
            hackPos += hackDir;
            if(hackPos > 100 || hackPos < 0) hackDir *= -1;
            document.getElementById('hack-cursor').style.left = hackPos + '%';
            hackAnim = requestAnimationFrame(animate);
        }
        animate();
    }

    function stopHack() {
        cancelAnimationFrame(hackAnim);
        if(hackPos >= window.hackTargetMin && hackPos <= window.hackTargetMax) {
            let reward = calcIncome() * 300; if(reward < 1000) reward = 1000;
            addEnergy(reward);
            alert(`💻 Система взломана!\n+${Math.floor(reward)} PUNK`);
            tg.HapticFeedback.notificationOccurred('success');
            AudioFX.play('buy');
            state.lastHack = Date.now();
            state.totalHacks++;
            checkAchievements();
            checkQuestProgress();
        } else {
            tg.HapticFeedback.notificationOccurred('error');
            AudioFX.play('tap');
            state.lastHack = Date.now() - 240000; 
        }
        document.getElementById('hack-modal').style.display = 'none';
        checkHackStatus();
    }

    // ------------------------ РЕЙД -------------------------
    function startRaidEvent() {
        if(state.inBattle) return;
        raidActive = true; raidClicks = 0;
        let btn = document.getElementById('raid-btn');
        btn.style.display = 'flex';
        AudioFX.play('raid'); tg.HapticFeedback.notificationOccurred('error');
        setTimeout(() => { if(raidActive) { raidActive = false; btn.style.display = 'none'; } }, 5000);
    }

    function hitRaidBoss() {
        if(!raidActive) return;
        raidClicks++; tg.HapticFeedback.impactOccurred('heavy');
        let btn = document.getElementById('raid-btn');
        btn.style.transform = 'scale(0.9)'; setTimeout(() => btn.style.transform = 'scale(1)', 50);
        if(raidClicks >= 10) {
            raidActive = false; btn.style.display = 'none';
            let reward = calcIncome() * 120; if(reward < 500) reward = 500;
            addEnergy(reward);
            alert(`👾 Босс повержен!\n+${Math.floor(reward)} PUNK`);
            tg.HapticFeedback.notificationOccurred('success');
        }
    }

    // ------------------------ ДОСТИЖЕНИЯ, КВЕСТЫ -------------------------
    function getAchievementProgress(ach) {
        if(ach.target === 'clicks') return state.totalClicks;
        if(ach.target === 'ships') return Object.values(state.ships).reduce((a,b)=>a+b,0);
        if(ach.target === 'enemies') return state.totalEnemiesDefeated;
        if(ach.target === 'hacks') return state.totalHacks;
        if(ach.target === 'total') return state.total;
        return 0;
    }

    function checkAchievements() {
        ACHIEVEMENTS.forEach(ach => {
            if(state.achievements[ach.id]) return;
            let progress = getAchievementProgress(ach);
            if(progress >= ach.count) {
                state.achievements[ach.id] = true;
                addEnergy(ach.reward);
                showAchievementNotification(ach);
            }
        });
    }

    function showAchievementNotification(ach) {
        let notif = document.createElement('div');
        notif.style.cssText = 'position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--glass); border: 2px solid var(--yellow); padding: 15px; border-radius: 12px; z-index: 200; text-align: center; animation: slideUp 0.3s;';
        notif.innerHTML = `
            <div style="font-size: 24px; margin-bottom: 5px;">${ach.icon}</div>
            <div style="font-weight: bold; color: var(--yellow); margin-bottom: 5px;">Достижение открыто!</div>
            <div style="font-size: 14px;">${ach.name}</div>
            <div style="font-size: 12px; color: var(--cyan); margin-top: 5px;">+${ach.reward} PUNK</div>
        `;
        document.body.appendChild(notif);
        setTimeout(() => { notif.style.opacity = '0'; notif.style.transition = 'opacity 0.5s'; setTimeout(() => notif.remove(), 500); }, 3000);
        tg.HapticFeedback.notificationOccurred('success');
    }

    function checkQuestProgress() {
        QUESTS.forEach(quest => {
            if(state.quests[quest.id].completed) return;
            let prog = 0;
            if(quest.target === 'any') prog = state.totalEnemiesDefeated;
            else if(quest.target === 'clicks') prog = state.totalClicks;
            else if(quest.target === 'ships') prog = Object.values(state.ships).reduce((a,b)=>a+b,0);
            else if(quest.target === 'hacks') prog = state.totalHacks;
            else if(quest.target === 'achievements') prog = Object.keys(state.achievements).length;
            else if(quest.target === 'daily') prog = state.dailyStreak;
            else if(state.defeatedEnemies[quest.target]) prog = state.defeatedEnemies[quest.target];
            if(prog >= quest.count && !state.quests[quest.id].completed) {
                state.quests[quest.id].completed = true;
                addEnergy(quest.reward);
                alert(`🎯 Квест завершён: ${quest.name}\n+${quest.reward} PUNK`);
            }
            state.quests[quest.id].progress = prog;
        });
    }

    // ------------------------ ЕЖЕДНЕВНЫЕ -------------------------
    function claimDailyReward() {
        let today = new Date().toDateString();
        let lastDaily = new Date(state.lastDaily).toDateString();
        if(today === lastDaily) { alert('Вы уже получили награду сегодня!'); return; }
        let streak = state.dailyStreak;
        let yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
        if(new Date(state.lastDaily).toDateString() === yesterday.toDateString()) streak++;
        else streak = 1;
        let dayNum = Math.min(streak, 7);
        let reward = DAILY_REWARDS[dayNum - 1];
        state.lastDaily = Date.now();
        state.dailyStreak = streak;
        addEnergy(reward.reward);
        if(reward.bonus.includes('x')) {
            let mult = parseFloat(reward.bonus.match(/x([\d.]+)/)[1]);
            let hours = reward.bonus.match(/(\d+)\s*час/);
            let duration = hours ? parseInt(hours[1]) * 3600000 : 3600000;
            state.activeEvents['daily_boost'] = Date.now() + duration;
        }
        alert(`Ежедневная награда!\n+${reward.reward} PUNK\n${reward.bonus}`);
        tg.HapticFeedback.notificationOccurred('success');
        updateDailyButton();
    }

    function updateDailyButton() {
        let today = new Date().toDateString();
        let lastDaily = new Date(state.lastDaily).toDateString();
        let btn = document.getElementById('daily-btn');
        if(today !== lastDaily) btn.classList.remove('claimed');
        else btn.classList.add('claimed');
    }

    // ------------------------ СЮЖЕТ -------------------------
    function checkStoryProgress() {
        for(let chapter of STORY_CHAPTERS) {
            if(state.storyFlags[chapter.id]) continue;
            if(state.total >= chapter.threshold) {
                state.storyFlags[chapter.id] = true;
                addEnergy(chapter.reward);
                showStoryNotification(chapter);
                if(chapter.unlocksFactions) {
                    showDialogue('faction_choice');
                }
                if(chapter.id === 'prologue') unlockLore('lore_reactor');
                if(chapter.id === 'chap1') unlockLore('lore_syndicate');
                if(chapter.id === 'chap2') unlockLore('lore_corpo');
                if(chapter.id === 'chap3') unlockLore('lore_ai');
                if(chapter.id === 'chap4') unlockLore('lore_spark');
            }
        }
    }

    function showStoryNotification(chapter) {
        let notif = document.createElement('div');
        notif.style.cssText = 'position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--glass); border: 2px solid var(--accent); padding: 15px; border-radius: 12px; z-index: 200; text-align: center; max-width: 80%; animation: slideUp 0.3s;';
        notif.innerHTML = `<div style="font-size: 24px; margin-bottom: 5px;">📖</div><div style="font-weight: bold; color: var(--accent); margin-bottom: 5px;">${chapter.title}</div><div style="font-size: 12px;">${chapter.content}</div><div style="color: var(--yellow); margin-top: 8px;">+${chapter.reward} PUNK</div>`;
        document.body.appendChild(notif);
        setTimeout(() => { notif.style.opacity = '0'; notif.style.transition = 'opacity 0.5s'; setTimeout(() => notif.remove(), 500); }, 8000);
        tg.HapticFeedback.notificationOccurred('success');
    }

    function unlockLore(loreId) {
        if(state.journalUnlocked.includes(loreId)) return;
        state.journalUnlocked.push(loreId);
        let entry = LORE_ENTRIES.find(l => l.id === loreId);
        if(entry) entry.unlocked = true;
        let notif = document.createElement('div');
        notif.style.cssText = 'position: fixed; bottom: 20px; right: 20px; background: var(--glass); border-left: 4px solid var(--cyan); padding: 8px 12px; border-radius: 8px; font-size: 11px; z-index: 200;';
        notif.innerText = `📖 Новая запись: ${entry.title}`;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 3000);
    }

    function showDialogue(dialogueId) {
        let d = DIALOGUES[dialogueId];
        if(!d || state.dialogueFlags[dialogueId]) return;
        state.dialogueFlags[dialogueId] = true;
        let modal = document.getElementById('main-modal');
        let title = document.getElementById('modal-title');
        let content = document.getElementById('modal-content');
        title.innerText = '💬 ДИАЛОГ';
        content.innerHTML = `<div style="padding: 15px; background: rgba(0,0,0,0.5); border-radius: 12px; margin-bottom: 15px;">${d.text}</div>`;
        if(d.choices.length) {
            d.choices.forEach(choice => {
                let btn = document.createElement('button');
                btn.className = 'hack-btn-action';
                btn.style.marginBottom = '10px';
                btn.innerText = choice.text;
                btn.onclick = () => {
                    if(choice.effect) {
                        let parts = choice.effect.split(',');
                        parts.forEach(p => {
                            let [key, val] = p.split(':');
                            if(key === 'addCrew') state.crew[val] = (state.crew[val] || 0) + 1;
                            if(key === 'faction') state.factionRep[val] += parseInt(choice.effect.split('rep+')[1]);
                        });
                        if(choice.reward) addEnergy(choice.reward);
                    }
                    closeModal();
                };
                content.appendChild(btn);
            });
        } else {
            let closeBtn = document.createElement('button');
            closeBtn.className = 'hack-btn-action';
            closeBtn.innerText = 'Продолжить';
            closeBtn.onclick = closeModal;
            content.appendChild(closeBtn);
        }
        modal.style.display = 'flex';
    }

    function checkDialogues() {
        for(let key in DIALOGUES) {
            if(state.dialogueFlags[key]) continue;
            let d = DIALOGUES[key];
            try {
                if(eval(d.trigger)) showDialogue(key);
            } catch(e) {}
        }
    }

    // ------------------------ МЕНЮ -------------------------
    function openMenu(type) {
        let modal = document.getElementById('main-modal');
        let title = document.getElementById('modal-title');
        let content = document.getElementById('modal-content');
        content.innerHTML = '';
        
        if(type === 'ships') {
            title.innerText = t('title_ships');
            DB.ships.forEach(s => {
                let cnt = state.ships[s.id] || 0;
                let price = Math.floor(s.cost * Math.pow(1.15, cnt));
                renderItem(content, td(s.id), `+${s.inc}/s | ${t('txt_installed')}: ${cnt}`, price, s.img, false, () => {
                    if(state.energy >= price) {
                        state.energy -= price;
                        state.ships[s.id] = cnt + 1;
                        AudioFX.play('buy');
                        openMenu('ships');
                        checkAchievements();
                        checkQuestProgress();
                    }
                });
            });
        }
        else if(type === 'crew') {
            title.innerText = t('title_crew');
            DB.crew.forEach(c => {
                let lvl = state.crew[c.id] || 0;
                let price = Math.floor(c.cost * Math.pow(1.4, lvl));
                renderItem(content, `${td(c.id)} (${t('txt_lvl')} ${lvl})`, td(c.id+'d'), price, c.img, false, () => {
                    if(state.energy >= price) {
                        state.energy -= price;
                        state.crew[c.id] = lvl + 1;
                        AudioFX.play('buy');
                        openMenu('crew');
                    }
                });
            });
        }
        else if(type === 'implants') {
            title.innerText = t('title_imp');
            DB.implants.forEach(item => {
                let isOwned = state.implants.includes(item.id);
                renderItem(content, td(item.id), isOwned ? t('txt_installed') : td(item.id+'d'), item.cost, item.img, isOwned, () => {
                    if(isOwned) return;
                    if(state.energy >= item.cost) {
                        state.energy -= item.cost;
                        state.implants.push(item.id);
                        AudioFX.play('buy');
                        openMenu('implants');
                    }
                });
            });
        }
        else if(type === 'quests') {
            title.innerText = '📜 КВЕСТЫ';
            QUESTS.forEach(q => {
                let prog = state.quests[q.id];
                let percent = Math.min(Math.floor((prog.progress / q.count) * 100), 100);
                let html = `<div class="item" style="border-color: ${prog.completed ? '#0f0' : '#666'};"><div class="item-info"><div class="item-name">${q.name}</div><div class="item-desc">${q.desc}</div><div style="height:6px;background:#111;border-radius:3px;margin-bottom:5px;"><div style="height:100%;background:var(--cyan);width:${percent}%;"></div></div><div style="font-size:10px;color:#888;">${prog.progress}/${q.count}</div></div><div style="text-align:right;"><div style="font-size:20px;">✓</div><div style="color:var(--yellow);font-size:12px;">+${q.reward}</div></div></div>`;
                content.innerHTML += html;
            });
        }
        else if(type === 'achievements') {
            title.innerText = '🏆 ДОСТИЖЕНИЯ';
            ACHIEVEMENTS.forEach(ach => {
                let completed = state.achievements[ach.id] || false;
                let progress = getAchievementProgress(ach);
                let percent = Math.min((progress / ach.count) * 100, 100);
                let html = `<div class="item" style="border-color: ${completed ? '#0f0' : '#666'};"><div class="item-info"><div class="item-name">${ach.icon} ${ach.name} ${completed ? '<span class="achievement-badge">✓</span>' : ''}</div><div class="item-desc">${ach.desc}</div><div style="height:6px;background:#111;border-radius:3px;margin-bottom:5px;"><div style="height:100%;background:var(--yellow);width:${percent}%;"></div></div><div style="font-size:10px;color:#888;">${progress}/${ach.count}</div></div><div style="text-align:right;"><div style="color:var(--yellow);font-size:12px;">+${ach.reward}</div></div></div>`;
                content.innerHTML += html;
            });
        }
        else if(type === 'daily') {
            title.innerText = '📅 ЕЖЕДНЕВНЫЕ';
            let today = new Date().toDateString();
            let canClaim = today !== new Date(state.lastDaily).toDateString();
            let streak = state.dailyStreak;
            let nextDay = Math.min(streak + 1, 7);
            content.innerHTML = `<div style="text-align:center; margin-bottom:20px;"><div style="font-size:24px;font-weight:bold;color:var(--yellow);">День ${nextDay}</div><div style="font-size:14px;">Серия: ${streak} дней</div></div>`;
            DAILY_REWARDS.forEach((reward, idx) => {
                let dayNum = idx+1;
                let isClaimed = dayNum <= streak;
                let isToday = dayNum === nextDay && canClaim;
                let html = `<div class="item" style="border-color: ${isToday ? 'var(--yellow)' : isClaimed ? '#0f0' : '#666'}; opacity: ${dayNum > nextDay ? 0.5 : 1};"><div class="item-info"><div class="item-name">День ${dayNum} ${isClaimed ? '✓' : ''}</div><div class="item-desc">${reward.bonus}</div></div><div style="text-align:right;"><div style="color:var(--yellow);">+${reward.reward}</div>${isToday ? '<button class="btn-buy" onclick="claimDailyReward()" style="margin-top:5px;">ПОЛУЧИТЬ</button>' : ''}</div></div>`;
                content.innerHTML += html;
            });
        }
        else if(type === 'upgrades') {
            title.innerText = '⚡ УЛУЧШЕНИЯ';
            UPGRADES.forEach(up => {
                let isOwned = state.upgrades[up.id] || false;
                renderItem(content, up.name, up.desc, up.cost, '⚡', isOwned, () => {
                    if(isOwned) return;
                    if(state.energy >= up.cost) {
                        state.energy -= up.cost;
                        state.upgrades[up.id] = true;
                        AudioFX.play('buy');
                        openMenu('upgrades');
                    }
                });
            });
        }
        else if(type === 'events') {
            title.innerText = '⚡ АКТИВНЫЕ СОБЫТИЯ';
            let hasEvents = false;
            for(let evId in state.activeEvents) {
                let event = RANDOM_EVENTS.find(e => e.id === evId);
                if(event && state.activeEvents[evId] > Date.now()) {
                    let timeLeft = Math.ceil((state.activeEvents[evId] - Date.now()) / 60000);
                    content.innerHTML += `<div class="item"><div class="item-info"><div class="item-name">${event.icon} ${event.name}</div><div class="item-desc">${event.desc}</div><div style="font-size:10px;color:var(--cyan);">Осталось: ${timeLeft} мин</div></div></div>`;
                    hasEvents = true;
                }
            }
            if(!hasEvents) content.innerHTML = '<p style="text-align:center;color:#888;">Нет активных событий</p>';
        }
        else if(type === 'prestige') {
            title.innerText = '🔄 ПЕРЕРОЖДЕНИЕ';
            let tokensEarned = Math.floor(state.total / 1000000);
            let currentBonus = state.prestigeTokens * 10;
            content.innerHTML = `<div style="text-align:center;margin-bottom:20px;padding:15px;background:rgba(211,0,211,0.1);border-radius:12px;"><div style="font-size:18px;font-weight:bold;color:var(--accent);">Токенов: ${state.prestigeTokens}</div><div>Бонус: +${currentBonus}% дохода</div><div>Токенов за эту игру: ${tokensEarned}</div></div><div style="padding:15px;background:rgba(255,0,0,0.1);border-radius:12px;"><div style="margin-bottom:10px;">⚠️ ВСЁ БУДЕТ СБРОШЕНО, КРОМЕ ТОКЕНОВ</div><button class="hack-btn-action" onclick="doPrestige()" ${tokensEarned < 1 ? 'disabled' : ''}>ПЕРЕРОДИТЬСЯ ЗА ${tokensEarned} ТОКЕНОВ</button></div>`;
        }
        else if(type === 'story') {
            title.innerText = '📖 ИСТОРИЯ';
            STORY_CHAPTERS.forEach(ch => {
                let unlocked = state.storyFlags[ch.id];
                let html = `<div class="item" style="border-color: ${unlocked ? 'var(--yellow)' : '#444'};"><div class="item-info"><div class="item-name">${ch.title}</div><div class="item-desc">${unlocked ? ch.content : '???'}</div></div></div>`;
                content.innerHTML += html;
            });
        }
        else if(type === 'factions') {
            title.innerText = '⚔️ ФРАКЦИИ';
            for(let key in FACTIONS) {
                let f = FACTIONS[key];
                let rep = state.factionRep[key] || 0;
                let html = `<div class="item" style="border-color: var(--accent);"><div class="item-info"><div class="item-name">${f.name}</div><div class="item-desc">${f.desc}</div><div>Репутация: ${rep}</div>${rep>=50 ? '<div class="achievement-badge">+10% доход</div>' : ''}${rep>=200 ? '<div class="achievement-badge">Эксклюзивный предмет</div>' : ''}</div></div>`;
                content.innerHTML += html;
            }
        }
        else if(type === 'journal') {
            title.innerText = '📓 ЖУРНАЛ ЛОРА';
            LORE_ENTRIES.forEach(entry => {
                let unlocked = state.journalUnlocked.includes(entry.id);
                let html = `<div class="item" style="border-color: ${unlocked ? 'var(--cyan)' : '#444'}; opacity: ${unlocked ? 1 : 0.6};"><div class="item-info"><div class="item-name">${entry.title} ${unlocked ? '' : '(закрыто)'}</div><div class="item-desc">${unlocked ? entry.content : '???'}</div></div></div>`;
                content.innerHTML += html;
            });
        }
        modal.style.display = 'flex';
    }

    function renderItem(container, name, desc, price, img, isOwned, onClick) {
        let div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `<img src="${img}" onerror="this.src='https://via.placeholder.com/50?text=ERR'"><div class="item-info"><div class="item-name">${name}</div><div class="item-desc">${desc}</div></div><button class="btn-buy ${isOwned ? 'btn-owned' : ''}">${isOwned ? '✓' : formatNum(price)}</button>`;
        if(!isOwned) div.querySelector('button').onclick = onClick;
        container.appendChild(div);
    }

    function closeModal() { document.getElementById('main-modal').style.display = 'none'; }

    // ------------------------ ПРЕСТИЖ -------------------------
    function doPrestige() {
        let tokensEarned = Math.floor(state.total / 1000000);
        if(tokensEarned < 1) { alert('Нужно накопить 1M PUNK для перерождения!'); return; }
        if(!confirm(`Переродиться и сбросить прогресс?\nПолучите ${tokensEarned} токенов.\nВсего станет: ${state.prestigeTokens + tokensEarned}`)) return;
        state.prestigeTokens += tokensEarned;
        state.energy = 0;
        state.total = 0;
        state.ships = {};
        state.crew = {};
        state.implants = [];
        state.quests = {};
        state.defeatedEnemies = {};
        state.totalClicks = 0;
        state.totalEnemiesDefeated = 0;
        state.totalHacks = 0;
        state.achievements = {};
        state.upgrades = {};
        state.activeEvents = {};
        state.lastHack = 0;
        state.location = 'streets';
        state.inBattle = false;
        state.currentEnemy = null;
        QUESTS.forEach(q => { state.quests[q.id] = { progress: 0, completed: false }; });
        alert(`Перерождение!\n+${tokensEarned} токенов!\nБонус: +${state.prestigeTokens * 10}% дохода!`);
        tg.HapticFeedback.notificationOccurred('success');
        saveGame();
        updateHUD();
        closeModal();
    }

    // ------------------------ СЛУЧАЙНЫЕ СОБЫТИЯ -------------------------
    function triggerEvent(event) {
        if(event.duration > 0) state.activeEvents[event.id] = Date.now() + event.duration;
        else state.activeEvents[event.id] = Date.now() + 1;
        if(event.effect === 'bonus_energy') addEnergy(event.value);
        showEventNotification(event);
    }

    function showEventNotification(event) {
        let evt = RANDOM_EVENTS.find(e => e.id === event.id);
        if(evt) {
            document.getElementById('event-text').innerText = evt.desc;
            document.getElementById('event-notification').style.display = 'flex';
            tg.HapticFeedback.notificationOccurred('success');
        }
    }

    function startRandomEvent() {
        if(Math.random() > 0.95 && Object.keys(state.activeEvents).length === 0) {
            let event = RANDOM_EVENTS[Math.floor(Math.random() * RANDOM_EVENTS.length)];
            triggerEvent(event);
        }
    }

    function checkActiveEvents() {
        for(let evId in state.activeEvents) {
            if(state.activeEvents[evId] <= Date.now()) delete state.activeEvents[evId];
        }
    }

    // ------------------------ СОХРАНЕНИЕ И ПРОЧЕЕ -------------------------
    function saveGame() {
        state.lastSave = Date.now();
        localStorage.setItem('cp_wars_v2', JSON.stringify(state));
    }

    function initMatrix() {
        const c = document.getElementById('matrix-canvas');
        const ctx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const chars = "01XYZ"; 
        const fontSize = 14;
        const columns = c.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(5, 0, 10, 0.1)";
            ctx.fillRect(0, 0, c.width, c.height);
            ctx.fillStyle = "#0f0"; ctx.font = fontSize + "px monospace";
            for(let i=0; i<drops.length; i++) {
                const text = chars[Math.floor(Math.random()*chars.length)];
                ctx.fillText(text, i*fontSize, drops[i]*fontSize);
                if(drops[i]*fontSize > c.height && Math.random() > 0.98) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 50);
    }

    function toggleLang() {
        let idx = LANGS.indexOf(curLang);
        curLang = LANGS[(idx + 1) % LANGS.length];
        localStorage.setItem('cp_lang', curLang);
        updateLanguageUI();
    }

    function updateLanguageUI() {
        document.getElementById('lang-toggle').innerText = curLang.toUpperCase();
        document.querySelectorAll('[data-key]').forEach(el => {
            el.innerText = t(el.getAttribute('data-key'));
        });
        updateHUD();
    }

    // ------------------------ ЗАПУСК -------------------------
    const zone = document.getElementById('tap-zone');
    zone.addEventListener('touchstart', tap, {passive:false});
    zone.addEventListener('mousedown', tap);
    setTimeout(() => document.getElementById('explore-btn').style.display = 'block', 3000);
    setInterval(() => { let inc = calcIncome() / 10; if(inc > 0) addEnergy(inc); updateHUD(); checkHackStatus(); }, 100);
    setInterval(() => { if(Math.random() > 0.8 && !raidActive && !state.inBattle) startRaidEvent(); }, 10000);
    setInterval(saveGame, 5000);
    setInterval(startRandomEvent, 120000);
    setInterval(checkActiveEvents, 1000);
    setInterval(checkAchievements, 5000);
    setInterval(checkQuestProgress, 5000);
    initMatrix();
    updateLanguageUI();
    if(!state.storyFlags.prologue && state.total === 0) {
        state.storyFlags.prologue = true;
        showStoryNotification(STORY_CHAPTERS[0]);
        unlockLore('lore_reactor');
    }
    checkHackStatus();
    updateDailyButton();
    if(!localStorage.getItem('cp_welcome_shown')) {
        setTimeout(() => { alert('Добро пожаловать в CosmoPunk!\nСюжет, фракции, журнал и многое другое ждут вас!'); localStorage.setItem('cp_welcome_shown','true'); }, 1000);
    }
</script>
</body>
</html>
